[project]
name = "dawg-replay-kit"
dynamic = ["version"]
description = "Библиотека для скриптов dawg-replay: параметры, события, браузеры DAWG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
# Для kit.browser(). В скриптах эти пакеты и так перечислены в заголовке PEP 723.
browser = ["dawg-sdk-python>=0.4,<0.5", "playwright>=1.58,<2", "httpx>=0.27"]

[tool.hatch.version]
# Единственное место версии: __version__ в пакете. Мажор kit совпадает с мажором контракта.
path = "src/dawg_replay_kit/__init__.py"

[tool.uv]
# Версия динамическая (__version__ в __init__.py), а uv по умолчанию пересобирает пакет только
# при изменении pyproject.toml. Без этого ключа uv sync и uv run оставляют старую версию kit.
# Ключи заменяют набор uv по умолчанию, поэтому pyproject.toml указан явно.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/dawg_replay_kit/__init__.py" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
