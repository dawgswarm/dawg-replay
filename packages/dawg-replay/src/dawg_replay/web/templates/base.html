{% from "_icons.html" import icon %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "selfRequestsOnly": true, "historyCacheSize": 0, "attributesToSettle": ["class", "width", "height"]}'>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <title>{% block title %}dawg-replay{% endblock %}</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body{% if runs_active(request) %} class="runs-active"{% endif %}>
  <a class="skip" href="#main">К содержимому</a>
  <header class="top">
   <div class="top-inner">
    <a class="brand" href="/" aria-label="dawg-replay, на главную">
      <svg class="brand-mark" viewBox="0 0 40 16" aria-hidden="true">
        <path class="brand-line" d="M2 12 C 10 12, 12 4, 20 4 S 30 12, 38 12" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
        <circle class="brand-dot" cx="38" cy="12" r="2.6" fill="currentColor"/>
      </svg>
      <span>dawg-replay</span>
    </a>
    <nav class="nav" aria-label="Разделы">
      <a href="/" {% if active == 'home' %}aria-current="page"{% endif %}>Главная</a>
      <a href="/scripts" {% if active == 'scripts' %}aria-current="page"{% endif %}>Скрипты</a>
      <a href="/settings" {% if active == 'settings' %}aria-current="page"{% endif %}>Настройки</a>
    </nav>
    <form class="top-search" action="/scripts" method="get" role="search">
      <label>{{ icon("search") }}<span class="sr">Найти скрипт</span>
        <input type="search" name="q" value="{{ search_q or '' }}" placeholder="Найти скрипт" autocomplete="off"></label>
    </form>
    <button class="icon-button" type="button" data-theme-toggle title="Тема: светлая или тёмная" aria-label="Переключить тему: светлая или тёмная">{{ icon("theme") }}</button>
   </div>
  </header>
  <main class="page" id="main">
    <div id="flash" aria-live="polite"></div>
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">dawg-replay {{ versions.app }} · kit {{ versions.kit }} · контракт {{ versions.contract }}</footer>
</body>
</html>
