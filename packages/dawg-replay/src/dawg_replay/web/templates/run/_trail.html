<div id="run-trail" class="run-trail">
  {% if s.timeline %}
  <ol class="trail trail-vertical">
    {% for step in s.timeline %}
    <li class="trail-step{% if loop.last and running %} trail-current trail-active{% endif %}"{% if loop.last and running %} aria-current="step"{% endif %}>
      <span class="trail-name">{{ step.name }}</span>
      <span class="trail-time">{{ step.ts | clock }}</span>
    </li>
    {% endfor %}
  </ol>
  {% else %}
  <p class="hint">{% if running %}Скрипт готовится к работе: ставит зависимости и открывает браузер.{% else %}Скрипт не сообщал о шагах.{% endif %}</p>
  {% endif %}
</div>
