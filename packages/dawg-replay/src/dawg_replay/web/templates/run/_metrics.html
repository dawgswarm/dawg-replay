<div id="run-metrics" class="run-metrics{% if not s.metrics %} is-empty{% endif %}">
  {% if s.metrics %}
  <h2 class="sr">Показатели</h2>
  <dl class="metrics">
    {% for m in s.metrics.values() %}
    <div class="metric">
      <dt>{{ m.label }}</dt>
      <dd title="{{ m.value | value }}{% if m.unit %} {{ m.unit }}{% endif %}"><span class="metric-value">{{ m.value | value }}</span>{% if m.unit %} <span class="metric-unit">{{ m.unit }}</span>{% endif %}</dd>
    </div>
    {% endfor %}
  </dl>
  {% endif %}
</div>
