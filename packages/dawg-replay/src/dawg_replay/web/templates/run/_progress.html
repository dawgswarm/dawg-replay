<div id="run-progress" class="run-progress{% if not s.progress %} is-empty{% endif %}">
  {% if s.progress %}
  <ul class="bars" aria-label="Прогресс">
    {% for p in s.progress.values() %}
    <li class="bar">
      <span class="bar-label">{{ p.label }}</span>
      <span class="bar-count">{% if p.total %}{{ p.done | value }} из {{ p.total | value }}{% else %}{{ p.done | value }}{% endif %}</span>
      {% if p.total %}<progress class="meter" value="{{ p.done if p.done <= p.total else p.total }}" max="{{ p.total }}">{{ p.done }} из {{ p.total }}</progress>{% endif %}
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
