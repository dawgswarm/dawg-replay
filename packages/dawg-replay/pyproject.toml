[project]
name = "dawg-replay"
version = "1.1.0"
description = "Локальное приложение для запуска скриптов сбора данных через браузеры DAWG"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "dawgswarm" }]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "dawg-replay-kit>=1.2,<2",
    "dawg-sdk-python>=0.4,<0.5",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "keyring>=25",
    "openpyxl>=3.1",
    "platformdirs>=4",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://dawgswarm.ru"
Source = "https://github.com/dawgswarm/dawg-replay"
Issues = "https://github.com/dawgswarm/dawg-replay/issues"

[project.scripts]
dawg-replay = "dawg_replay.cli:main"

[tool.uv]
# uv по умолчанию пересобирает локальный пакет только при изменении pyproject.toml, а версия
# меняется не на каждый коммит. Без этого ключа `uv tool install --from ./packages/dawg-replay`
# берёт из кеша колесо со старым кодом той же версии (приёмка M3, dr-69): шаблоны, стили и
# Python-код тоже входят в ключ.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]

[tool.uv.sources]
dawg-replay-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
