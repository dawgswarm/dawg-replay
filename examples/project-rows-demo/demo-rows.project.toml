name = "demo-rows"
title = "Демо: цены по городам"
description = "Вход отдаёт токен, список городов отдаёт таблицу, цены собираются по разу на каждый активный город."

[[nodes]]
id = "login"
script = "demo-login"
x = 40
y = 40

[[nodes]]
id = "cities"
script = "demo-cities"
x = 40
y = 200

[[nodes]]
id = "prices"
script = "demo-city-prices"
x = 360
y = 120

[[edges]]
from = "login"
to = "prices"
map = [{ value = "token", to = "token" }, { value = "shop", to = "shop" }]

[[edges]]
from = "cities"
to = "prices"
map = [{ from = "cities.csv", column = "Город", to = "city", rows = "each" }]
where = { column = "Активен", op = "equals", value = "да" }
parallel = 2
on_error = "continue"
